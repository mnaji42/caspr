# Publie une release : tag poussé → DMG construit, signé, attaché.
#
# Le déclencheur est un tag, pas un push sur main. C'est la même décision que
# côté application, qui compare des releases et non des commits : un tag est
# une déclaration explicite que cette version-ci est bonne à installer.
name: Release

on:
  push:
    tags: ["v*"]
  # Pour éprouver la chaîne sans rien publier.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Le moteur intégré utilise SpeechTranscriber, une API de macOS 26 : il
    # faut un runner dont le SDK la connaisse. Sur un SDK plus ancien la
    # compilation échoue sur un symbole introuvable, ce que l'étape « SDK »
    # ci-dessous transforme en message lisible.
    runs-on: macos-26
    # Le build prend trois minutes. Au-delà de vingt, quelque chose attend une
    # saisie plutôt que de travailler, et mieux vaut le voir échouer que le
    # laisser pendre six heures jusqu'au délai par défaut.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # version.sh dérive la version du dernier tag : sans l'historique
          # complet, git describe ne voit rien et tout s'appellerait 0.0.0.
          fetch-depth: 0

      - name: Xcode le plus récent disponible
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Vérifier que le SDK connaît macOS 26
        run: |
          sdk="$(xcrun --show-sdk-version)"
          echo "SDK macOS $sdk"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::SDK macOS $sdk — le moteur intégré exige le SDK 26." \
                 "Changez l'image du runner, ou construisez la release localement" \
                 "avec ./scripts/package-dmg.sh."
            exit 1
          fi

      # Un tag dont les tests échouent ne publie rien : ils ne tournaient qu'à
      # la main, et rien n'empêchait d'oublier.
      - name: Tester
        working-directory: app
        run: swift test

      # Sans certificat, codesign signe « ad hoc » et l'exigence désignée
      # contient le hash du binaire : elle change à chaque version, donc macOS
      # révoque l'autorisation d'accessibilité de tous les utilisateurs à
      # chaque mise à jour. Avec un certificat stable — même auto-signé —
      # l'exigence ne dépend plus du binaire et l'autorisation tient.
      #
      # Secrets attendus :
      #   SIGNING_CERTIFICATE_P12       le .p12 encodé en base64
      #   SIGNING_CERTIFICATE_PASSWORD  son mot de passe
      # Le jour du compte Apple Developer, on y met le Developer ID
      # Application à la place : rien d'autre ne change ici.
      - name: Importer le certificat de signature
        id: signing
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            # Sur un tag, c'est une erreur : la release partirait signée ad
            # hoc, la mise à jour intégrée la refuserait (autre signature), et
            # l'accessibilité de tous serait révoquée. Seul un lancement à la
            # main, qui éprouve la chaîne sans rien publier, s'en contente.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Aucun certificat sur un tag : une release ad hoc" \
                   "casserait la mise à jour intégrée et l'accessibilité de" \
                   "tous les utilisateurs."
              exit 1
            fi
            echo "::warning::Aucun certificat : signature ad hoc." \
                 "Les utilisateurs devront ré-accorder l'accessibilité après" \
                 "cette mise à jour."
            # Explicitement « - », et non une chaîne vide : vide, install.sh
            # retomberait sur le certificat de développement local, dont la
            # création attend un trousseau de session qu'aucun runner n'a
            # déverrouillé — le build pendrait jusqu'au délai maximal.
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/caspr.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Sans cette ligne, codesign réclame une validation interactive du
          # trousseau, que personne ne peut donner sur un runner.
          security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          # Sans `-v`, et c'est tout le sujet. Un certificat auto-signé n'est
          # jamais « valide » au sens de la confiance — `find-identity -v` le
          # classe CSSMERR_TP_NOT_TRUSTED et ne le liste pas — alors que
          # codesign l'accepte parfaitement : signer ne demande que la clé
          # privée, la confiance ne regarde que la vérification.
          #
          # Avec `-v`, la sortie était « 0 valid identities found », dont le
          # deuxième mot est « valid ». L'ancien `awk NR==1 {print $2}` le
          # prenait pour une empreinte, le test de non-vacuité passait, et le
          # build échouait plus loin sur « valid: no identity found » — une
          # erreur qui ne nomme ni le certificat ni l'étape fautive.
          #
          # On extrait donc une empreinte, pas un mot : quarante caractères
          # hexadécimaux, ou rien.
          hash="$(security find-identity -p codesigning "$keychain" \
                  | grep -oE '[0-9A-F]{40}' | head -1)"
          if [ -z "$hash" ]; then
            echo "::error::Certificat importé, mais aucune identité de" \
                 "signature n'en ressort. Le .p12 contient-il bien sa clé" \
                 "privée ? (security find-identity -p codesigning)"
            exit 1
          fi
          echo "identité de signature : $hash"
          echo "identity=$hash" >> "$GITHUB_OUTPUT"

      - name: Construire le DMG
        env:
          CASPR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./scripts/package-dmg.sh

      - name: Vérifier le paquet
        run: |
          hdiutil attach dist/Caspr.dmg -mountpoint /tmp/caspr -nobrowse -quiet
          codesign --verify --deep --strict /tmp/caspr/Caspr.app
          codesign -d -r- /tmp/caspr/Caspr.app 2>&1 | grep -F "designated =>"
          # L'entitlement micro est la panne la plus sournoise du projet :
          # absent, le runtime durci refuse le micro sans aucun dialogue, et
          # l'application paraît simplement muette.
          codesign -d --entitlements - /tmp/caspr/Caspr.app 2>/dev/null \
              | grep -q "audio-input" \
              || { echo "::error::entitlement micro absent"; exit 1; }
          hdiutil detach /tmp/caspr -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: Caspr.dmg
          path: dist/Caspr.dmg

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh` est préinstallé sur les runners : une action tierce de plus
          # serait une dépendance de plus dans la chaîne qui signe le binaire
          # que des gens vont installer.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Caspr.dmg --clobber
            exit 0
          fi

          # Le corps de la release n'est pas qu'une page web : l'application le
          # récupère et l'affiche dans la fenêtre qui propose la mise à jour
          # (cf. `ReleaseNotes.swift`). C'est la seule chose qui puisse motiver
          # quelqu'un à remplacer un logiciel qui marche.
          #
          # `--generate-notes` produit « * Titre du commit by @auteur in URL »,
          # ce qui se lit sur GitHub et pas dans une fenêtre de 400 points. On
          # préfère donc des notes écrites à la main, une puce par changement,
          # en français. Cf. RELEASES.md.
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            echo "notes de version : $notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "Caspr $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              dist/Caspr.dmg
          else
            # Repli, jamais un échec : une note oubliée ne doit pas retenir un
            # correctif. L'application sait ramener les notes engendrées à des
            # phrases lisibles, simplement moins bonnes que celles qu'on aurait
            # écrites.
            echo "::warning::$notes absent — notes engendrées par GitHub." \
                 "Voir RELEASES.md."
            gh release create "$GITHUB_REF_NAME" \
              --title "Caspr $GITHUB_REF_NAME" \
              --generate-notes \
              dist/Caspr.dmg
          fi
